<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对于拨号错误651修复文件下载</title>
    <style>
        :root {
            /* 白天模式配色 */
            --bg-color: #f4f6fa;
            --text-color: #1f2937;
            --accent-color: #a83619;
            --btn-bg: #1f6feb;
            --btn-text: #ffffff;
            --btn-hover: #1d4ed8;
            --btn-disabled: #93c5fd;
            --status-color: #6b7280;
            --link-color: #1f6feb;
            --card-shadow: rgba(31, 41, 55, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* 系统为深色时的默认配色（夜间模式） */
                --bg-color: #020202;
                --text-color: #ffffff;
                --accent-color: #ff7a50;
                --btn-bg: #d4d4d4;
                --btn-text: #000000;
                --btn-hover: #ffffff;
                --btn-disabled: #44474d;
                --status-color: #9ca3af;
                --link-color: #60a5fa;
                --card-shadow: rgba(0, 0, 0, 0.5);
            }
        }

        html[data-theme="light"] {
            --bg-color: #f4f6fa;
            --text-color: #1f2937;
            --accent-color: #a83619;
            --btn-bg: #1f6feb;
            --btn-text: #ffffff;
            --btn-hover: #1d4ed8;
            --btn-disabled: #93c5fd;
            --status-color: #6b7280;
            --link-color: #1f6feb;
            --card-shadow: rgba(31, 41, 55, 0.15);
        }

        html[data-theme="dark"] {
            --bg-color: #020202;
            --text-color: #ffffff;
            --accent-color: #ff7a50;
            --btn-bg: #d4d4d4;
            --btn-text: #000000;
            --btn-hover: #ffffff;
            --btn-disabled: #44474d;
            --status-color: #9ca3af;
            --link-color: #60a5fa;
            --card-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        p {
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 16px;
            transition: color 0.4s ease;
        }

        a {
            color: var(--link-color);
            transition: color 0.4s ease;
        }

        strong {
            color: var(--accent-color);
        }

        .btn {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: none;   
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, color 0.2s;
            box-shadow: 0 2px 6px var(--card-shadow);
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            background-color: var(--btn-disabled);
            cursor: not-allowed;
        }

        .status {
            margin-top: 16px;
            font-size: 14px;
            color: var(--status-color);
            text-align: center;
        }
    </style>
</head>

<body>
    <div style="text-align: center;">
        <p>本脚本和网页仓库地址：<a href="https://github.com/touchinglie/net_script_for_gdupt" target="_blank">一些给广油同学的实用脚本和建议</a>，学长大四了很忙，随缘更新吧</p>
        <p>点击最左边下载reg文件的按钮然后双击运行按两次是即可重新<strong>插上网线断开流量</strong>拨号，都已经做到这样应该都会了，想学习研究的话可以看看仓库里源码</p>
        <p>下面右边两个按钮是在<strong>插上网线断开流量后</strong>从左到右按流程认证缴费，具体看教程</p>
        <div>
            <button id="downloadBtn" class="btn">下载 fix651.reg</button>
            <button id="authBtn" class="btn">身份认证</button>
            <button id="rechargeBtn" class="btn">充值缴费</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <script>
        // 根据客户端本地时间切换白天/黑夜模式
        (function applyThemeByTime() {
            const now = new Date();
            const hours = now.getHours();
            // 6 点 - 18 点视为白天，其余为黑夜（可自行调整区间）
            const isDay = hours >= 6 && hours < 18;
            document.documentElement.setAttribute('data-theme', isDay ? 'light' : 'dark');
        })();

        const FILE_URL = 'https://gh-proxy.com/https://raw.githubusercontent.com/touchinglie/net_script_for_gdupt/refs/heads/main/script/fix651.reg';
        const FILE_NAME = 'fix651.reg';

        const btn = document.getElementById('downloadBtn');
        const authBtn = document.getElementById('authBtn');
        const rechargeBtn = document.getElementById('rechargeBtn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = '正在下载...';

            try {
                // 通过 fetch 获取文件内容
                const response = await fetch(FILE_URL);

                if (!response.ok) {
                    throw new Error(`请求失败 (${response.status})`);
                }

                // 读取为 Blob
                const blob = await response.blob();

                // 创建临时 URL
                const blobUrl = URL.createObjectURL(blob);

                // 创建隐藏的 <a> 标签触发下载
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = FILE_NAME;
                document.body.appendChild(a);
                a.click();

                // 清理
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);

                status.textContent = '下载已开始';
            } catch (err) {
                console.error(err);
                status.textContent = '下载失败：' + err.message;
            } finally {
                btn.disabled = false;
            }
        });

        authBtn.addEventListener('click', () => {
            const authUrl = 'http://10.255.253.10:8080/Self/';
            window.open(authUrl, '_blank');
        });

        rechargeBtn.addEventListener('click', () => {
            const rechargeUrl = 'http://10.255.253.10:8080/WebPay/';
            window.open(rechargeUrl, '_blank');
        });
    </script>
</body>

</html>
